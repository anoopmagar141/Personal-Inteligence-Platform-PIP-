<text x="50" y="366.4" font-family="Times New Roman" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">backend/core (18 modules)</text>
<rect x="40" y="374" width="420" height="186" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="50" y="398.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">pipeline · evidence_gate · constitution_enforcer</text>
<text x="50" y="415.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">constitution_version · types · trace · auth</text>
<text x="50" y="432.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">session_key · db_key · profiles · response_cache</text>
<text x="50" y="449.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">session_lifecycle · pinned_executor · restore</text>
<text x="50" y="466.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">backup_mark · instance_lock · proactive</text>
<text x="50" y="483.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">startup_progress</text>
<text x="50" y="500.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#444">uses sqlcipher3 (restore.py)</text>
<rect x="520" y="350" width="221.1" height="24" rx="0" fill="#e2e2e2" stroke="#000" stroke-width="1.4"/>
<text x="530" y="366.4" font-family="Times New Roman" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">backend/stages (14 modules)</text>
<rect x="520" y="374" width="300" height="186" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="530" y="398.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">one run() each:</text>
<text x="530" y="415.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">00 gap · 01 intent · 02 route</text>
<text x="530" y="432.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">03 decisions · 04 memory · 05 documents</text>
<text x="530" y="449.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">06 web search · 07 context</text>
<text x="530" y="466.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">08 provider gate · 09 LLM · 10 delivery</text>
<text x="530" y="483.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">11 Observer · 12 validation · 13 write</text>
<text x="530" y="500.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#444">uses ddgs (stage 06)</text>
<rect x="900" y="350" width="177.29999999999998" height="24" rx="0" fill="#e2e2e2" stroke="#000" stroke-width="1.4"/>
<text x="910" y="366.4" font-family="Times New Roman" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">backend/providers (3)</text>
<rect x="900" y="374" width="300" height="136" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="910" y="398.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">base_provider (BaseLLMProvider)</text>
<text x="910" y="415.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">ollama_provider</text>
<text x="910" y="432.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">openai_compatible_provider</text>
<text x="910" y="449.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#444">uses urllib (standard library)</text>
<rect x="40" y="660" width="221.1" height="24" rx="0" fill="#e2e2e2" stroke="#000" stroke-width="1.4"/>
<text x="50" y="676.4" font-family="Times New Roman" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">backend/memory (11 modules)</text>
<rect x="40" y="684" width="780" height="106" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="50" y="708.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">profile_store · conversation_store · decision_log · candidate_store</text>
<text x="50" y="725.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">governance_audit · pending_observer · session_snapshot · verification</text>
<text x="50" y="742.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">vector_store · llm_endpoint_store · avatar_store</text>
<text x="50" y="759.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#444">uses sqlcipher3, chromadb, sentence-transformers, cryptography, pypdf</text>
<rect x="900" y="660" width="120" height="24" rx="0" fill="#e2e2e2" stroke="#000" stroke-width="1.4"/>
<text x="910" y="676.4" font-family="Times New Roman" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">backend/config</text>
<rect x="900" y="684" width="140" height="66" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="910" y="708.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">settings.json</text>
<text x="910" y="725.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">and its loader</text>
