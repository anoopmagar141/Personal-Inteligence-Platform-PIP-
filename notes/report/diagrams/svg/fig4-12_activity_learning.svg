<text x="430" y="884.4" font-family="Times New Roman" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">A decision?</text>
<polyline points="540,880 823.0,880" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<text x="554" y="872.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">[yes]</text>
