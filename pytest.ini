[pytest]
pythonpath = .
asyncio_mode = auto
# A hung test reports itself instead of sitting silent.
#
# One run of this suite stopped dead partway through - 450s of CPU, then zero
# for twenty minutes with flat memory - and left nothing to diagnose it by. It
# has not recurred in nine runs since, which is exactly why the ceiling is
# here: the next occurrence should print a stack rather than be noticed by
# somebody wondering why the terminal has gone quiet.
#
# 300s is far above anything real. The whole suite is ~1174 tests in about
# four minutes, so no individual test is remotely near this; it is a ceiling,
# not a budget.
#
# thread, not signal: signal-based timeouts do not interrupt a thread blocked
# in a C call, and the plausible causes here are all of that shape - a
# connection close submitted to a worker that never dequeues it, a lock nobody
# releases. The thread method dumps every thread's stack, which is the part
# worth having.
timeout = 300
timeout_method = thread
