<polyline points="320,660 320,562" fill="none" stroke="#000" stroke-width="1.3" stroke-dasharray="7 4" marker-end="url(#open)"/>
<polyline points="670,560 670,658" fill="none" stroke="#000" stroke-width="1.3" stroke-dasharray="7 4" marker-end="url(#open)"/>
<polyline points="40,850 90,850" fill="none" stroke="#000" stroke-width="1.3" stroke-dasharray="7 4" marker-end="url(#open)"/>
<text x="100" y="854.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">imports from (the arrow points at the package imported)</text>
<text x="40" y="887.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Counted from the import statements of every module outside backend/tests (2026-10-22). Both ways between core and stages: pipeline.py</text>
<text x="40" y="901.8" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">runs the stages, and the stages use core&#x27;s types, evidence gate, trace and Constitution. Both ways between core and memory: core&#x27;s</text>
<text x="40" y="916.4" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">pipeline and sign-in use the stores, and the stores use core&#x27;s types, keys and trace. Not drawn: config is imported by api, core,</text>
<text x="40" y="931.0" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">stages, memory and providers; shared by api, core and stages. No module under stages or api imports sqlite3 or chromadb (a git hook checks this).</text>
