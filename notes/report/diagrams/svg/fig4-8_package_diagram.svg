<text x="450" y="36.4" font-family="Times New Roman" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">frontend/flutter (the app)</text>
<rect x="440" y="44" width="360" height="62" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="450" y="68.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">Dart: screens, api_client.dart,</text>
<text x="450" y="85.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">ws_chat_client.dart</text>
<rect x="440" y="170" width="104.3" height="24" rx="0" fill="#e2e2e2" stroke="#000" stroke-width="1.4"/>
<text x="450" y="186.4" font-family="Times New Roman" font-size="13" text-anchor="start" font-weight="bold" font-style="normal" fill="#000">backend/api</text>
<rect x="440" y="194" width="360" height="72" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/>
<text x="450" y="218.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">server.py: 68 REST routes, /ws/chat,</text>
<text x="450" y="235.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="normal" fill="#000">middleware, api_*(conn, ...) functions</text>
<text x="450" y="252.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#444">uses FastAPI, Starlette</text>
