<text x="648" y="1191.4" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">or short of the count, max 2]</text>
<polyline points="640,1188 640,1310 823.0,1310" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="825.0" y="1282.0" width="250" height="56" rx="14" fill="#fff" stroke="#000" stroke-width="1.3"/>
<text x="950.0" y="1306.5" font-family="Times New Roman" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">Reject it; audit row</text>
<text x="950.0" y="1322.3" font-family="Times New Roman" font-size="13" text-anchor="middle" font-weight="normal" font-style="normal" fill="#000">(stage 12)</text>
<text x="648" y="1294.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">[refused]</text>
