<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PIP — Iris blue</title>
  <defs>
    <mask id="blade" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100" height="100" fill="#000"></rect>
      <circle cx="50" cy="50" r="45" fill="#fff"></circle>
      <circle cx="64" cy="50" r="39" fill="#000"></circle>
      <rect x="50" y="0" width="50" height="100" fill="#000" transform="rotate(-18 50 50)"></rect>
    </mask>
  </defs>
  <g mask="url(#blade)"><rect x="0" y="0" width="100" height="100" fill="#1B2E8C"></rect></g>
  <g transform="rotate(60 50 50)" mask="url(#blade)"><rect x="0" y="0" width="100" height="100" fill="#2C4BE0"></rect></g>
  <g transform="rotate(120 50 50)" mask="url(#blade)"><rect x="0" y="0" width="100" height="100" fill="#4B66E8"></rect></g>
  <g transform="rotate(180 50 50)" mask="url(#blade)"><rect x="0" y="0" width="100" height="100" fill="#6B85FF"></rect></g>
  <g transform="rotate(240 50 50)" mask="url(#blade)"><rect x="0" y="0" width="100" height="100" fill="#93A6FF"></rect></g>
  <g transform="rotate(300 50 50)" mask="url(#blade)"><rect x="0" y="0" width="100" height="100" fill="#C2CCFF"></rect></g>
</svg>