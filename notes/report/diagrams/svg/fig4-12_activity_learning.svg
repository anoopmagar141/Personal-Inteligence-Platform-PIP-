<text x="700" y="1479.8" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Later, on the Review screen, the user confirms</text>
<text x="700" y="1494.4" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">or dismisses each queued question.</text>
<text x="700" y="1509.1" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">Confirm writes it as the user&#x27;s own; dismiss writes</text>
<text x="700" y="1523.7" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">nothing. Either way a second audit row</text>
<text x="700" y="1538.4" font-family="Times New Roman" font-size="12" text-anchor="start" font-weight="normal" font-style="italic" fill="#000">is added (actor: user).</text>
